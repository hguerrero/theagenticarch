# Reusable Hugo build. Used by CI and every deploy workflow so the build
# steps live in exactly one place. The caller MUST run actions/checkout first
# (a local composite action can't be located until the repo is checked out).
name: 'hugo-build'
description: 'Install Hugo and build the static site into ./public.'

inputs:
  hugo-version:
    description: 'Hugo version to install. Pin it for reproducible deploys.'
    required: false
    default: '0.166.0'
  extended:
    description: 'Use Hugo extended build (true/false) for SCSS/CSS.'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup Hugo
      uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3
      with:
        hugo-version: ${{ inputs.hugo-version }}
        extended: ${{ inputs.extended }}

    - name: Build
      shell: bash
      run: hugo --minify --gc --destination=public
