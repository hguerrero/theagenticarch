baseURL = 'https://theagenticarch.com/'
locale = 'en-us'
title = 'The Agentic Architect'
theme = 'PaperMod'
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

# Google Analytics 4 measurement ID (rendered by layouts/_partials/google_analytics.html)
[services.googleAnalytics]
  id = 'G-GRYKZ2CY32'

# Mount cover images into assets/ too, so Hugo can resize them for homepage cards.
[module]
  [[module.mounts]]
    source = 'static'
    target = 'static'
  [[module.mounts]]
    source = 'static/images'
    target = 'assets/images'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'archetypes'
    target = 'archetypes'

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = 'production'
  description = 'Architecture patterns for agentic systems people can trust: LLM systems, agents, tooling, and the patterns that make them work.'
  author = 'Hugo Guerrero'
  showReadingTime = true
  disableSpecificTags = ['content', 'gallery']
  origin = ['https://theagenticarch.com']
  defaultTheme = 'dark'
  disableThemeToggle = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  hideScrollbar = false
  mainSections = ['posts']

  # Fallback image for og:image / twitter:image / schema "image" on pages
  # without their own cover (homepage, About, Archive, Privacy).
  images = ['/og-image.png']

  # Homepage <meta name="keywords">.
  keywords = ['agentic AI', 'AI agents', 'agent architecture', 'AI gateway', 'API gateway', 'MCP', 'model context protocol', 'context engineering', 'event-driven architecture', 'AI governance']

  [params.schema]
    # sameAs entities for the site's Organization JSON-LD (excludes the RSS
    # feed link, which is not a profile URL and shouldn't be listed here).
    sameAs = [
      'https://github.com/hguerrero',
      'https://linkedin.com/in/hugoguerrero',
      'https://www.instagram.com/theagenticarch/',
      'https://www.youtube.com/@theagenticarch',
      'https://www.tiktok.com/@theagenticarch',
      'https://www.facebook.com/profile.php?id=61592474153825',
    ]

  [params.assets]
    favicon = '/theagenticarch-logo-32.png'
    favicon16x16 = '/theagenticarch-logo-16.png'
    favicon32x32 = '/theagenticarch-logo-32.png'
    apple_touch_icon = '/theagenticarch-logo-180.png'

  [params.label]
    text = 'The Agentic Architect'
    icon = '/theagenticarch-logo.png'
    iconHeight = 42

[[params.socialIcons]]
  name = 'github'
  url  = 'https://github.com/hguerrero'

[[params.socialIcons]]
  name = 'linkedin'
  url  = 'https://linkedin.com/in/hugoguerrero'

[[params.socialIcons]]
  name = 'rss'
  url  = '/index.xml'

[[params.socialIcons]]
  name = 'instagram'
  url  = 'https://www.instagram.com/theagenticarch/'

[[params.socialIcons]]
  name = 'youtube'
  url  = 'https://www.youtube.com/@theagenticarch'

[[params.socialIcons]]
  name = 'tiktok'
  url  = 'https://www.tiktok.com/@theagenticarch'

[[params.socialIcons]]
  name = 'facebook'
  url  = 'https://www.facebook.com/profile.php?id=61592474153825'


[[menu.main]]
  identifier = 'posts'
  name = 'Articles'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'about'
  name = 'About'
  url = '/about/'
  weight = 20

[[menu.main]]
  identifier = 'archive'
  name = 'Archive'
  url = '/archive/'
  weight = 30

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = 'monokai'
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[imaging]
  resampleFilter = 'catmullrom'
  anchor = 'smart'
  [imaging.jpeg]
    quality = 75
  [imaging.webp]
    quality = 75
