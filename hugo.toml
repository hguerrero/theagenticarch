baseURL = 'https://theagenticarch.com/'
locale = 'en-us'
title = 'The Agentic Architect'
theme = 'PaperMod'
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false

# Google Analytics (optional)
# googleAnalytics = "G-XXXXXXXXXX"

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = 'production'
  description = 'Architecture patterns for agentic systems people can trust: LLM systems, agents, tooling, and the patterns that make them work.'
  author = 'Hugo Guerrero'
  showReadingTime = true
  disableSpecificTags = ['content', 'gallery']
  origin = ['https://theagenticarch.com']
  defaultTheme = 'auto'
  disableThemeToggle = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  hideScrollbar = false
  mainSections = ['posts']

  [params.assets]
    favicon = '/theagenticarch-logo-32.png'
    favicon16x16 = '/theagenticarch-logo-16.png'
    favicon32x32 = '/theagenticarch-logo-32.png'
    apple_touch_icon = '/theagenticarch-logo-180.png'

  [params.label]
    text = 'The Agentic Architect'
    icon = '/theagenticarch-logo.png'
    iconHeight = 42

[[params.socialIcons]]
  name = 'github'
  url  = 'https://github.com/hguerrero'

[[params.socialIcons]]
  name = 'linkedin'
  url  = 'https://linkedin.com/in/hugoguerrero'

[[params.socialIcons]]
  name = 'rss'
  url  = '/index.xml'

[[params.socialIcons]]
  name = 'instagram'
  url  = 'https://www.instagram.com/theagenticarch/'

[[params.socialIcons]]
  name = 'youtube'
  url  = 'https://www.youtube.com/@theagenticarch'

[[params.socialIcons]]
  name = 'tiktok'
  url  = 'https://www.tiktok.com/@theagenticarch'

[[params.socialIcons]]
  name = 'facebook'
  url  = 'https://www.facebook.com/profile.php?id=61592474153825'


[[menu.main]]
  identifier = 'posts'
  name = 'Articles'
  url = '/posts/'
  weight = 10

[[menu.main]]
  identifier = 'about'
  name = 'About'
  url = '/about/'
  weight = 20

[[menu.main]]
  identifier = 'archive'
  name = 'Archive'
  url = '/archive/'
  weight = 30

[markup]
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = 'monokai'
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false

[imaging]
  resampleFilter = 'catmullrom'
  anchor = 'smart'
  [imaging.jpeg]
    quality = 75
  [imaging.webp]
    quality = 75
